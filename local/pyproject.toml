[project]
name = "mysilo"
version = "1.2.0"
requires-python = ">=3.11"
authors = [
    { name = "Viktor Vazharski" },
]
dependencies = [
    "boto3>=1.34.0",
    "watchdog>=4.0.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0.0",
    "click>=8.3.2",
]

[project.scripts]
mysilo = "mysilo.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "moto[s3]>=5.1.22",
    "pytest>=9.0.3",
]
